[project]
name = "lorax"
version = "0.1.0"
description = "LoRA fine-tuning from scratch in numpy — no GPU required"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lorax"]
